name: "Run Smoke Tests"
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: "OS: ${{ matrix.runner }}, node@${{ matrix.node }}"
    strategy:
      matrix:
        runner: [ubuntu, macos, windows]
        node: [24.x, latest]
      fail-fast: false
    runs-on: ${{ matrix.runner }}-latest
    timeout-minutes: 30 # Installing dependencies on windows can take a while
    env:
      npm_config_loglevel: verbose
      npm_config_foreground_scripts: "true"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          check-latest: true
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx @mongodb-js/mongodb-runner -- exec -- sh -c 'env MONGOSH_SMOKE_TEST_SERVER=$MONGODB_URI npm run test-smoke'

name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The mongosh@x.y.z tag to publish from. Leave empty to publish the latest release.'
        required: false
        type: string
      dry-run:
        description: 'Run without publishing anything'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

description: |
  Publishes the npm packages of a release (the mongosh release packages and
  anything not already in npm). Run this after the evergreen publish stage
  (barque, download center, release promotion) has completed, with the
  mongosh@x.y.z tag that it pushed.

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: mongodb-js/devtools-shared/actions/setup-bot-token@main
        id: app-token
        with:
          app-id: ${{ vars.DEVTOOLS_BOT_APP_ID }}
          private-key: ${{ secrets.DEVTOOLS_BOT_PRIVATE_KEY }}

      - name: Resolve tag to publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            PUBLISH_TAG="$TAG_INPUT"
          else
            PUBLISH_TAG=$(gh api 'repos/mongodb-js/mongosh/tags?per_page=100' --jq '.[].name' \
              | grep '^mongosh@' | sort -V | tail -1)
            [ -n "$PUBLISH_TAG" ] || { echo 'Could not find any mongosh@ tag'; exit 1; }
          fi
          echo "Publishing from tag: ${PUBLISH_TAG}"
          echo "PUBLISH_TAG=${PUBLISH_TAG}" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.PUBLISH_TAG }}
          fetch-depth: "0" # this is important so git log can pick up on the whole history to generate the list of AUTHORS
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          check-latest: true
          node-version: 24.x

      - name: Install Dependencies
        run: npm ci

      - name: Publish npm packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "Publishing packages as $(npm whoami)"
          npm run evergreen-release npm-publish -- ${{ inputs.dry-run && '--dry-run' || '' }}

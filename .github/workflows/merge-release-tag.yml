name: Merge Release Tag

on:
  create:
  workflow_dispatch:

permissions:
  contents: none # We use the github app to checkout and push changes

jobs:
  merge-release-tag:
    if: ${{ startsWith(github.ref, 'refs/tags/mongosh@') }}
    runs-on: ubuntu-latest

    steps:
      - uses: mongodb-js/devtools-shared/actions/setup-bot-token@48521375c90a504db064c2805af41741c1aaf789 # main
        id: app-token
        with:
          app-id: ${{ vars.DEVTOOLS_BOT_APP_ID }}
          private-key: ${{ secrets.DEVTOOLS_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          # fetch-depth 0 also fetches all tags, which the script below needs:
          # it reads the branch annotation off the vX.Y.Z tag, and that is not
          # the tag that triggered this workflow.
          fetch-depth: "0"
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge release tag into the branch it was released from
        env:
          MERGE_REF: ${{ github.ref }}
          MERGE_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # `npm run release publish` annotates the release tag with the branch
          # the release was cut from, e.g. "v2.14.1 from v2.x". The version
          # bump has to land on that branch: releasing from main and releasing
          # from a version/release branch must not be mixed up, and the tagged
          # commit itself does not tell us which branch it belongs to.
          version="${MERGE_REF_NAME#mongosh@}"
          target_branch="$(git for-each-ref "refs/tags/v${version}" \
            --format='%(contents:subject)' \
            | sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+ from ([A-Za-z0-9._/-]+)$/\1/p')"

          if [ -z "${target_branch}" ]; then
            echo "No source branch recorded on v${version}, using ${DEFAULT_BRANCH}"
            target_branch="${DEFAULT_BRANCH}"
          fi

          if ! git fetch origin "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"; then
            echo "Branch ${target_branch} does not exist, using ${DEFAULT_BRANCH}"
            target_branch="${DEFAULT_BRANCH}"
            git fetch origin "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          fi

          echo "Merging ${MERGE_REF_NAME} into ${target_branch}"
          git checkout -B "${target_branch}" "refs/remotes/origin/${target_branch}"
          git merge "${MERGE_REF}" -m "chore(release): merge changes from ${MERGE_REF_NAME}"
          git push origin "${target_branch}"

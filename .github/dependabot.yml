version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql-action:
        patterns:
          - github/codeql-action/*
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPFS multi-tab shared access</title>
  <style>
    body { font-family: 'Consolas', 'Courier New', monospace; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #4ec9b0; border-bottom: 2px solid #4ec9b0; padding-bottom: 10px; }
    pre { background: #2d2d2d; border: 1px solid #3e3e3e; border-radius: 4px; padding: 16px; min-height: 100px; }
    button { background: #4ec9b0; border: none; color: #1e1e1e; padding: 10px 20px; margin: 10px 8px 10px 0; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .pass { color: #4ec9b0; }
    .fail { color: #f48771; }
    .info { color: #dcdcaa; }
    a { color: #4ec9b0; }
  </style>
</head>
<body>
  <h1>Multi-tab shared database</h1>
  <p><a href="index.html">← Demos</a></p>
  <p class="info">One tab holds the Web Lock and OPFS worker (owner). Other tabs use BroadcastChannel RPC to the owner. Open this page in two tabs and click Open in both — both should succeed.</p>
  <p>Open in new tab: <a href="opfs-multitab-shared.html" target="_blank" rel="noopener">opfs-multitab-shared.html</a></p>
  <div>
    <button type="button" id="open">Open database</button>
    <button type="button" id="insert">Insert test doc</button>
    <button type="button" id="count">Count documents</button>
  </div>
  <pre id="output"></pre>

  <script type="module">
    import { initOpfsDatabase } from '../smongo-browser.js';

    const DB = 'multiTabTest';
    const output = document.getElementById('output');
    const tabId = Math.random().toString(36).substring(2, 8);

    const log = (msg, className = '') => {
      const line = document.createElement('div');
      if (className) line.className = className;
      line.textContent = msg;
      output.appendChild(line);
    };

    log(`Tab ${tabId} — Open connects as owner or RPC client`, 'info');

    document.getElementById('open').onclick = async () => {
      try {
        output.textContent = '';
        log(`Tab ${tabId}`, 'info');
        await initOpfsDatabase(DB, ['testData']);
        log('✓ Connected (owner holds OPFS; this tab may be owner or client)', 'pass');
      } catch (err) {
        log(`❌ ${err.message}`, 'fail');
      }
    };

    document.getElementById('insert').onclick = async () => {
      try {
        output.textContent = '';
        const db = await initOpfsDatabase(DB, ['testData']);
        await db.collection('testData').insertOne({ fromTab: tabId, t: Date.now() });
        log('✓ Inserted', 'pass');
      } catch (err) {
        log(`❌ ${err.message}`, 'fail');
      }
    };

    document.getElementById('count').onclick = async () => {
      try {
        output.textContent = '';
        const db = await initOpfsDatabase(DB, ['testData']);
        const docs = await db.collection('testData').find({});
        log(`✓ Count: ${docs.length}`, 'pass');
      } catch (err) {
        log(`❌ ${err.message}`, 'fail');
      }
    };
  </script>
</body>
</html>

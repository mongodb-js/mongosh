server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ensure .wasm files are served with the correct MIME type so browsers
    # can use WebAssembly.instantiateStreaming (compiles while downloading).
    types {
        application/wasm wasm;
    }

    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ =404;
    }
}
